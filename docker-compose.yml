x-common: &common
  build: .
  image: saved:latest
  restart: unless-stopped
  env_file: .env
  environment:
    DATA_DIR: /data
    MEDIA_DIR: /media
    HF_HOME: /data/models
  volumes:
    - ./data:/data
    - ${MEDIA_HOST_DIR:-./data/media}:/media

services:
  api:
    <<: *common
    ports:
      - "8080:8080"
    environment:
      DATA_DIR: /data
      MEDIA_DIR: /media
      HF_HOME: /data/models
      API_TOKEN: ${API_TOKEN:-}
      # The cgroup of the machine/LXC running Docker, for whole-server CPU and RAM in /api/status.
      CGROUP_DIR: /host/cgroup
    mem_limit: 3g
    volumes:
      - ./data:/data
      - ${MEDIA_HOST_DIR:-./data/media}:/media
      - /sys/fs/cgroup:/host/cgroup:ro

  worker:
    <<: *common
    command: ["python", "-m", "app.worker"]
    mem_limit: 3500m
    stop_grace_period: 120s
