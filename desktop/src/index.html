<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saved</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="shell">
    <nav class="rail" aria-label="Main" id="rail"></nav>
    <div class="stage">
      <div class="banner" id="banner" role="status" hidden></div>
      <main id="views">
        <section class="view" id="v-dashboard" hidden></section>
        <section class="view frame-view" id="v-library" hidden></section>
        <section class="view" id="v-activity" hidden></section>
        <section class="view" id="v-settings" hidden></section>
      </main>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <dialog id="dlg"></dialog>
</body>
</html>
